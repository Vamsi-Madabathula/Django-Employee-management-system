<!DOCTYPE html>
<html>
<head>
    <title>Employees</title>
</head>
<body>

    <h1>Employee Management System</h1>

    <h2>Employees</h2>

    {% if employees %}
        <ul>
            {% for employee in employees %}
                <li>
                    {{ employee.name }} -
                    {{ employee.email }} -
                    {{ employee.department }}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No employees found.</p>
    {% endif %}

</body>
</html>
