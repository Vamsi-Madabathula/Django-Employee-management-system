
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Task</title>
</head>
<body>

    <!-- Page heading -->
    <h1>Add New Task</h1>

    <!-- Form submits data to the Django view -->
    <form method="POST">

        <!-- Django security token -->
        {% csrf_token %}

        <!-- Display fields created by forms.py -->
        {{ form.as_p }}

        <!-- Submit the form -->
        <button type="submit">Save Task</button>

    </form>

    <!-- Navigate back to the task list -->
    <a href="{% url 'tasks_list' %}">Back to Tasks</a>

</body>
</html>
